<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebStack</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>

  <!-- App Header -->
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L3 21L12 14.5L21 21Z" />
          </svg>
        </div>
        <div class="brand-title">WebStack</div>
        <span class="badge-live" id="statusBadge">Live Sync</span>
      </div>

      <div class="header-actions">
        <div class="search-nav">
          <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Search stack (/)..." autocomplete="off">
        </div>

        <button id="btnOpenAddModal" class="btn-circle-add" aria-label="Add Bookmark" title="Add Bookmark (N)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>

        <button id="btnOpenShortcuts" class="btn-circle-action" aria-label="Keyboard Shortcuts" title="Shortcuts (?)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
            <path d="M6 8h.001M10 8h.001M14 8h.001M18 8h.001M6 12h.001M10 12h.001M14 12h.001M18 12h.001M7 16h10"></path>
          </svg>
        </button>

        <button id="btnSettings" class="btn-circle-action" aria-label="Connection Settings" title="Server Connection">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>

        <button id="btnDisconnect" class="btn-circle-action" aria-label="Disconnect" title="Disconnect">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View -->
  <main>
    <div class="controls-bar">
      <div class="category-pills" id="categoryPills">
        <button class="chip active" data-cat="ALL">All (<span id="totalCount">0</span>)</button>
      </div>
    </div>

    <div class="grid" id="bookmarksGrid"></div>
  </main>

  <!-- Authentication Modal -->
  <div id="authModal" class="modal-overlay">
    <div class="modal-card" style="text-align: center;">
      <div style="width: 48px; height: 48px; background: var(--text); color: var(--bg); border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L3 21L12 14.5L21 21Z" />
        </svg>
      </div>
      <h2 style="font-size: 19px; font-weight: 700; margin-bottom: 4px;">WebStack Desktop</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 18px;" id="authDiscoveryStatus">Scanning Wi-Fi for phone...</p>

      <div id="authError" style="color: #ef4444; font-size: 12.5px; font-weight: 500; margin-bottom: 12px; display: none;"></div>

      <input type="text" id="pinInput" class="input-field" maxlength="6" placeholder="000000" style="text-align: center; font-size: 26px; font-weight: 700; letter-spacing: 6px; padding: 10px; margin-bottom: 14px;" inputmode="numeric">
      <button id="btnConnect" class="btn-primary" style="width: 100%; padding: 12px; font-size: 14px;">Connect to Phone</button>

      <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center;">
        <span>Server: <strong id="currentServerDisplay">http://localhost:8080</strong></span>
        <button type="button" id="btnEditServerInAuth" style="background: none; border: none; color: var(--text-muted); text-decoration: underline; cursor: pointer;">Change</button>
      </div>
    </div>
  </div>

  <!-- Add Bookmark Modal -->
  <div id="addModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h3 class="modal-header-title">Add Bookmark</h3>
          <p class="modal-header-sub">Saves locally and syncs to phone</p>
        </div>
        <button id="btnCloseAddModal" class="btn-modal-close" aria-label="Close">✕</button>
      </div>

      <form id="addBookmarkForm" style="display: flex; flex-direction: column; gap: 14px;">
        <div>
          <label style="font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;">URL</label>
          <input type="url" id="addUrl" class="input-field" placeholder="https://example.com" required style="margin-top: 5px;">
        </div>

        <div>
          <label style="font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;">Category</label>
          <input type="text" id="addCategory" class="input-field" placeholder="Personal" style="margin-top: 5px;">
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px;">
          <button type="button" id="btnCancelAdd" class="btn-circle-action" style="width: auto; height: auto; padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px;">Cancel</button>
          <button type="submit" id="btnSaveBookmark" class="btn-primary">Save Bookmark</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Settings / Server Modal -->
  <div id="settingsModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h3 class="modal-header-title">Server Connection</h3>
          <p class="modal-header-sub">Configure phone companion address</p>
        </div>
        <button id="btnCloseSettingsModal" class="btn-modal-close" aria-label="Close">✕</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div>
          <label style="font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;">Phone Address</label>
          <input type="text" id="serverUrlInput" class="input-field" placeholder="http://192.168.1.xxx:8080" style="margin-top: 5px; font-family: monospace;">
        </div>

        <button type="button" id="btnAutoScanServer" class="btn-primary" style="background: var(--surface-hover); color: var(--text); border: 1px solid var(--border);">
          Scan Wi-Fi for Phone (mDNS)
        </button>

        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px;">
          <button type="button" id="btnSaveSettings" class="btn-primary">Save Address</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
