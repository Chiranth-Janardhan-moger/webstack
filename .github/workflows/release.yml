name: Android CD (Release Build & Publish)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version tag for this release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build Signed Release & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Release Tag Environment Variable
        env:
          RELEASE_INPUT: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=$RELEASE_INPUT" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi

      - name: Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not configured. Aborting release build."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/release.keystore"

      - name: Build Release APKs
        run: |
          ./gradlew assembleRelease --no-configuration-cache
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'webstack123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'webstack' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'webstack123' }}

      - name: Prepare Release Artifacts
        run: |
          mkdir -p build-assets
          cp app/build/outputs/apk/release/app-release.apk build-assets/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk build-assets/webstack-${{ env.RELEASE_TAG }}.apk

      - name: Generate SHA256 Checksums
        run: |
          cd build-assets
          sha256sum *.apk > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Upload Artifacts to GitHub Run
        uses: actions/upload-artifact@v4
        with:
          name: webstack-release-builds
          path: build-assets/
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          body: |
            ## WebStack Release ${{ env.RELEASE_TAG }}
            
            This release was compiled automatically via GitHub Actions CI/CD pipeline.
            
            ### Included Binaries
            - `app-release.apk`: Universal release APK for F-Droid and direct install.
            - `webstack-${{ env.RELEASE_TAG }}.apk`: Versioned release APK.
            
            ### Checksums for Verification
            Refer to the attached `checksums-sha256.txt` file to verify downloaded assets locally.
          files: |
            build-assets/app-release.apk
            build-assets/webstack-${{ env.RELEASE_TAG }}.apk
            build-assets/checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release to GitLab
        if: env.GITLAB_PAT != ''
        run: |
          python scripts/gitlab_release_upload.py \
            build-assets/app-release.apk \
            build-assets/webstack-${{ env.RELEASE_TAG }}.apk \
            build-assets/checksums-sha256.txt
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
          GITLAB_API_URL: ${{ secrets.GITLAB_API_URL }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
